<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title-h desc-h">
  <title id="title-h">My AI Team issues delivery loop</title>
  <desc id="desc-h">An ideas and issues list cycles through Planner, Developer, Reviewer, and Auditor agents.</desc>
  <rect width="256" height="256" rx="56" fill="#312e81"/>

  <!-- One continuous, non-directional route: issues in, team works, issues out. -->
  <path d="M78 128c0-48 35-86 78-86s78 38 78 86-35 86-78 86-78-38-78-86Z" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M70 128h12" fill="none" stroke="#c4b5fd" stroke-width="8" stroke-linecap="round"/>

  <!-- Ideas become the issues queue. -->
  <rect x="13" y="76" width="59" height="104" rx="13" fill="#fff"/>
  <path d="M31 102c0-9 7-16 16-16s16 7 16 16c0 6-3 10-7 14-2 2-3 4-3 7H40c0-3-1-5-3-7-4-4-6-8-6-14Z" fill="#fbbf24" stroke="#312e81" stroke-width="5" stroke-linejoin="round"/>
  <path d="M41 130h12M43 137h8" fill="none" stroke="#312e81" stroke-width="5" stroke-linecap="round"/>
  <circle cx="27" cy="153" r="4" fill="#4f46e5"/>
  <path d="M39 153h21" fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="27" cy="168" r="4" fill="#4f46e5"/>
  <path d="M39 168h14" fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round"/>

  <defs>
    <g id="agent-h" stroke="#c4b5fd" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27 3v8" fill="none" stroke-width="5"/>
      <circle cx="27" cy="3" r="4" fill="#a5b4fc" stroke-width="5"/>
      <rect x="8" y="11" width="38" height="34" rx="12" fill="#fff" stroke="#e0e7ff" stroke-width="6"/>
      <circle cx="20" cy="27" r="3.5" fill="#4f46e5" stroke="none"/>
      <circle cx="34" cy="27" r="3.5" fill="#4f46e5" stroke="none"/>
      <path d="M20 36c4 4 10 4 14 0" fill="none" stroke="#312e81" stroke-width="5"/>
    </g>
  </defs>

  <!-- Planner + Developer, then Reviewer, then Auditor. -->
  <use href="#agent-h" transform="translate(82 22)"/>
  <use href="#agent-h" transform="translate(124 22)"/>
  <use href="#agent-h" transform="translate(181 91)"/>
  <use href="#agent-h" transform="translate(125 167)"/>
</svg>
